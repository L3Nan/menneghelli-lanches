local_backend: true
backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "cardapio"
    label: "Cardápio"
    files:
      - name: "products"
        label: "Cards do Cardápio"
        file: "data/products.json"
        format: "json"
        fields:
          - name: "products"
            label: "Lista de cards"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - { name: "id", label: "ID interno", widget: "string", hint: "Ex.: x-bacon" }
              - { name: "slug", label: "Slug da URL", widget: "string", hint: "Ex.: x-bacon" }
              - { name: "name", label: "Nome do card", widget: "string" }
              - { name: "subtitle", label: "Subtítulo", widget: "string", required: false }
              - name: "category"
                label: "Categoria"
                widget: "select"
                options:
                  - { label: "Burgers", value: "burgers" }
                  - { label: "Combos", value: "combos" }
                  - { label: "Acompanhamentos", value: "acompanhamentos" }
                  - { label: "Bebidas", value: "bebidas" }
              - { name: "price", label: "Preço", widget: "number", value_type: "float" }
              - { name: "featured", label: "Mostrar em Destaques da home", widget: "boolean", default: false }
              - { name: "active", label: "Card ativo", widget: "boolean", default: true }
              - { name: "image", label: "Imagem principal", widget: "image" }
              - name: "galleryImages"
                label: "Galeria extra"
                widget: "list"
                required: false
                summary: "{{fields.alt}}"
                hint: "Use para combos com várias imagens, como 4 hambúrgueres + batata."
                fields:
                  - { name: "src", label: "Imagem", widget: "image" }
                  - { name: "alt", label: "Texto alternativo", widget: "string", required: false }
              - { name: "description", label: "Descrição", widget: "text" }
              - name: "highlights"
                label: "Destaques"
                widget: "list"
                required: false
                field: { name: "item", label: "Destaque", widget: "string" }
